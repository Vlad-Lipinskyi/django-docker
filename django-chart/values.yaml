repository: your-registry/your-django-image
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false

config:
 POSTGRES_PORT: 5432
 POSTGRES_HOST: db 
 POSTGRES_PORT: 5432
 POSTGRES_USER: django_user
 POSTGRES_DB: django_db
 POSTGRES_PASSWORD: pass9764gd

# Цей блок описує Docker-образ, який буде використано для
# створення контейнера з нашим Django-застосунком. Тут:
# repository: шлях до Docker-образу
# tag: тег образу. Зазвичай latest, але краще використовувати
# конкретні теги, щоб уникнути неочікуваних оновлень.
# pullPolicy: політика завантаження образу. Варіанти:
# Always: завжди перевіряти й тягнути останню версію образу
# IfNotPresent: тягнути, лише якщо образу немає локально
# Never: ніколи не тягнути, використовувати лише локальний образ